name: Generate Trophy

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ryo-ma/github-profile-trophy@v1
        with:
          github_user: MR-JLTC
          max_column: 7
          theme: tokyonight
          output_path: assets/trophy.svg
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: update trophy"
